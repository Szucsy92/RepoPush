name: Android APK

# Kézzel indítható: Actions → Android APK → Run workflow.
# Az első futáskor létrehoz egy aláíró kulcsot (egyszer), titkosítva a `signing` ágra menti,
# a későbbi futások ugyanezt használják, így az APK-k egymásra frissíthetők.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: repopush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@v2

      - name: Aláíró kulcs (első futáskor létrejön, utána újrahasznosul)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          ENC="$RUNNER_TEMP/release.keystore.enc"
          PASSFILE=""
          HAS_BRANCH=0
          if git ls-remote --exit-code --heads origin signing >/dev/null 2>&1; then
            HAS_BRANCH=1
            git fetch --depth=1 origin signing
          fi

          # Jelszó: ha van secret, azt használjuk; ha nincs, automatikus jelszó a `signing` ágon.
          if [ -z "${KS_PASS:-}" ]; then
            echo "::warning::Nincs ANDROID_KEYSTORE_PASSWORD secret, automatikus jelszót használok (a signing ágon tárolva). Biztonságosabb: állíts be secretet (Settings → Secrets and variables → Actions)."
            if [ "$HAS_BRANCH" = 1 ] && git show FETCH_HEAD:keystore.pass >/dev/null 2>&1; then
              KS_PASS="$(git show FETCH_HEAD:keystore.pass)"
            else
              KS_PASS="$(openssl rand -hex 24)"
              PASSFILE="$KS_PASS"
            fi
            echo "::add-mask::$KS_PASS"
            export KS_PASS
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          fi
          if [ "${#KS_PASS}" -lt 12 ]; then
            echo "::error::Az ANDROID_KEYSTORE_PASSWORD túl rövid (legalább 12, ajánlott 20+ karakter)."
            exit 1
          fi
          if [ "$HAS_BRANCH" = 1 ]; then
            git show FETCH_HEAD:release.keystore.enc > "$ENC"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in "$ENC" -out "$KS" \
              || { echo "::error::A kulcs nem fejthető vissza. Ugyanaz a jelszó van a secretben, mint a generáláskor?"; exit 1; }
            echo "Meglévő aláíró kulcs használva."
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass:env KS_PASS -keypass:env KS_PASS \
              -dname "CN=RepoPush, O=Szucsy92, C=HU"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS -in "$KS" -out "$ENC"
            d="$(mktemp -d)"
            cp "$ENC" "$d/release.keystore.enc"
            if [ -n "$PASSFILE" ]; then printf '%s' "$PASSFILE" > "$d/keystore.pass"; fi
            cd "$d"
            git init -q -b signing
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add release.keystore.enc
            if [ -n "$PASSFILE" ]; then git add keystore.pass; fi
            git commit -q -m "Android signing key (encrypted, generated once)"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signing
            echo "Új aláíró kulcs létrehozva, titkosítva a 'signing' ágra mentve."
          fi
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"

      - run: bun install
      - run: bun run test
      - run: bun run build
        env:
          # Az appon belüli frissítés (OTA) ebből tudja, hol keresse a kiadásokat és melyik build fut: a verziószám a futás sorszáma.
          VITE_RELEASE_REPOSITORY: ${{ github.repository }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_APP_VERSION: 1.0.${{ github.run_number }}

      - name: Android projekt előkészítése
        run: |
          set -euo pipefail
          N="${{ github.run_number }}"
          ./node_modules/.bin/cap add android

          # Az app a rendszersávok (állapotsor, navigációs sáv) mögé is rajzol, azok átlátszók. A sávok magasságát
          # a SystemInsets plugin adja át a weboldalnak (CSS változók), így a fejléc ugyanott marad.
          MA="$(find android/app/src/main/java -name MainActivity.java | head -1)"
          test -n "$MA" || { echo "::error::MainActivity.java nem található"; exit 1; }
          PKG="$(grep -m1 -oP '^package \K[^;]+' "$MA")"
          cat > "$MA" <<JAVA
          package $PKG;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BiometricVaultPlugin.class);
              registerPlugin(PressHapticsPlugin.class);
              registerPlugin(SystemInsetsPlugin.class);
              registerPlugin(AppIconPlugin.class);
              registerPlugin(AppUpdatePlugin.class);
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) getWindow().setNavigationBarContrastEnforced(false);
              WindowInsetsControllerCompat bars = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              bars.setAppearanceLightStatusBars(false);
              bars.setAppearanceLightNavigationBars(false);
              View root = findViewById(android.R.id.content);
              root.setBackgroundColor(0xFF0B0F14);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, w) -> {
                Insets ime = w.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(0, 0, 0, ime.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          JAVA
          sed -i 's/^          //' "$MA"

          # Biometrikus tár: a repóban lévő natív Capacitor plugin (Keystore + ujjlenyomat) másolása a projektbe.
          sed "s/__PKG__/$PKG/" native/BiometricVaultPlugin.java > "$(dirname "$MA")/BiometricVaultPlugin.java"
          sed "s/__PKG__/$PKG/" native/PressHapticsPlugin.java > "$(dirname "$MA")/PressHapticsPlugin.java"
          sed "s/__PKG__/$PKG/" native/SystemInsetsPlugin.java > "$(dirname "$MA")/SystemInsetsPlugin.java"
          sed "s/__PKG__/$PKG/" native/AppIconPlugin.java > "$(dirname "$MA")/AppIconPlugin.java"
          # Appon belüli frissítés (OTA): letöltés az app gyorsítótárába + a rendszer telepítője (saját FileProvider alosztállyal).
          sed "s/__PKG__/$PKG/" native/AppUpdatePlugin.java > "$(dirname "$MA")/AppUpdatePlugin.java"
          sed "s/__PKG__/$PKG/" native/UpdateFileProvider.java > "$(dirname "$MA")/UpdateFileProvider.java"
          printf '\ndependencies {\n    implementation "androidx.biometric:biometric:1.1.0"\n}\n' >> android/app/build.gradle

          # Az app tokent tárol: ne kerüljön Google-biztonsági mentésbe.
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml

          # Biometrikus feloldás (ujjlenyomat/arc) a PIN mellett.
          grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # Appon belüli frissítés: az új APK telepítésének kérése.
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # Rezgés a gombnyomásra (haptic).
          grep -q android.permission.VIBRATE android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml

          # Váltható indítóikon (színtéma, easter egg): az ikonok XML-erőforrások (native/res), az indító belépési pont
          # pedig aliasokra kerül: az AppIcon plugin mindig az egyiket engedélyezi, a többit letiltja.
          cp -r native/res/. android/app/src/main/res/
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace('<category android:name="android.intent.category.LAUNCHER" />', "", 1)
          def alias(name, icon, round_icon, enabled):
              return (
                  '\n        <activity-alias android:name=".%s" android:targetActivity=".MainActivity"'
                  ' android:enabled="%s" android:exported="true"'
                  ' android:icon="@mipmap/%s" android:roundIcon="@mipmap/%s" android:label="@string/app_name">'
                  '\n            <intent-filter>'
                  '\n                <action android:name="android.intent.action.MAIN" />'
                  '\n                <category android:name="android.intent.category.LAUNCHER" />'
                  '\n            </intent-filter>'
                  '\n        </activity-alias>' % (name, enabled, icon, round_icon)
              )
          items = [("IconDefault", "ic_launcher", "ic_launcher_round", "true")] + [
              ("Icon" + n.capitalize(), "repopush_icon_" + n, "repopush_icon_" + n, "false") for n in ("coral", "sky", "sun", "violet")
          ]
          # A letöltött APK-t a rendszer telepítője csak FileProvideren át olvashatja (cache/updates/).
          provider = (
              '\n        <provider android:name=".UpdateFileProvider" android:authorities="${applicationId}.updates"'
              ' android:exported="false" android:grantUriPermissions="true">'
              '\n            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/repopush_update_paths" />'
              '\n        </provider>'
          )
          s = s.replace("</application>", "".join(alias(*i) for i in items) + provider + "\n    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          assert s.count("android.intent.category.LAUNCHER") == 5, "A manifest indító aliasai nem jöttek létre"
          assert "${applicationId}.updates" in s, "A frissítés FileProvidere nem került be"
          PY
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/repopush_update_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="updates/" />
          </paths>
          XML

          # Növekvő verziószám, hogy az új APK az előzőre telepíthető legyen.
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" "$G"
          grep -q "versionCode $N" "$G" || { echo "::error::A versionCode nem írható át ($G)"; exit 1; }

          # Ikon a public/icons/icon-512.png-ből.
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick
          SRC=public/icons/icon-512.png
          RES=android/app/src/main/res
          declare -A LEG=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            s=${LEG[$d]}; f=${FG[$d]}; i=$((f*66/100))
            for n in ic_launcher ic_launcher_round; do
              if [ -f "$RES/mipmap-$d/$n.png" ]; then convert "$SRC" -resize "${s}x${s}" "$RES/mipmap-$d/$n.png"; fi
            done
            if [ -f "$RES/mipmap-$d/ic_launcher_foreground.png" ]; then
              convert "$SRC" -resize "${i}x${i}" -background none -gravity center -extent "${f}x${f}" "$RES/mipmap-$d/ic_launcher_foreground.png"
            fi
          done
          if [ -f "$RES/values/ic_launcher_background.xml" ]; then
            sed -i -E 's/#[0-9A-Fa-f]{6}/#0b0f14/' "$RES/values/ic_launcher_background.xml"
          fi

      - name: APK építése
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Zipalign és aláírás
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          U="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$U" || { echo "::error::Nem készült APK"; exit 1; }
          # Dátumbélyeges név (budapesti idő), hogy a verziók megkülönböztethetők legyenek.
          STAMP="$(TZ=Europe/Budapest date '+%Y%m%d-%H%M')"
          HUMAN="$(TZ=Europe/Budapest date '+%Y-%m-%d %H:%M')"
          APK="RepoPush-1.0.${{ github.run_number }}-$STAMP.apk"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=RepoPush 1.0.${{ github.run_number }} ($HUMAN)" >> "$GITHUB_ENV"
          "$BT/zipalign" -p -f 4 "$U" aligned.apk
          "$BT/apksigner" sign --ks "$KS_FILE" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" --out "$APK" aligned.apk
          "$BT/apksigner" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: RepoPush-apk
          path: ${{ env.APK_FILE }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ${{ env.RELEASE_NAME }}
          body: Telepíthető, aláírt Android APK. Letöltés után nyisd meg a telefonon (ismeretlen forrásból telepítés engedélyezése kellhet).
          files: ${{ env.APK_FILE }}
